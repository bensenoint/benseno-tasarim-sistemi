<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #F0EDE8;
  font-family: "Geist", -apple-system, sans-serif;
  min-height: 100vh;
  display: flex; align-items: flex-start; justify-content: center;
  padding: 32px 16px; gap: 32px; flex-wrap: wrap;
}
h2 { font-size: 13px; color: #666; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; margin-bottom: 16px; }

/* ── Dashboard shell mockup ── */
.shell {
  width: 700px; background: #FBFAF7; border-radius: 16px;
  border: 1px solid #ECEAE3; overflow: hidden;
  box-shadow: 0 4px 32px rgba(22,22,26,.10);
}
.shell-header {
  height: 52px; background: #FBFAF7; border-bottom: 1px solid #ECEAE3;
  display: flex; align-items: center; padding: 0 20px; gap: 12px;
}
.shell-header img { height: 26px; width: auto; }
.shell-header .spacer { flex: 1; }
.shell-header .user-chip {
  display: flex; align-items: center; gap: 7px;
  background: #F4F2EC; border: 1px solid #ECEAE3; border-radius: 20px;
  padding: 4px 10px 4px 5px; font-size: 12px; color: #2E2E36; font-weight: 500;
  cursor: pointer;
}
.shell-header .user-chip .av {
  width: 22px; height: 22px; border-radius: 50%; background: #24479E;
  color: #fff; font: 700 9px/22px "Geist",sans-serif; text-align: center;
}
.gear-btn {
  width: 32px; height: 32px; border-radius: 8px; background: transparent;
  border: 1px solid #ECEAE3; cursor: pointer; display: flex; align-items: center; justify-content: center;
  color: #5B5B66; font-size: 16px;
}
.gear-btn.active { background: #24479E10; border-color: #24479E40; color: #24479E; }

/* ── Admin drawer ── */
.drawer-wrap { display: flex; }
.main-area {
  flex: 1; padding: 24px 20px; min-height: 420px;
  background: repeating-linear-gradient(0deg, #F4F2EC 0px, #F4F2EC 1px, transparent 1px, transparent 32px);
  background-size: 100% 32px; opacity: .5;
}
.drawer {
  width: 300px; background: #fff; border-left: 1px solid #ECEAE3;
  padding: 20px 18px;
}
.drawer-title {
  font-size: 14px; font-weight: 700; color: #16161A; margin-bottom: 4px;
  display: flex; align-items: center; gap: 8px;
}
.drawer-title .badge-admin {
  font-size: 9px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase;
  background: rgba(36,71,158,.10); color: #24479E; padding: 2px 6px; border-radius: 4px;
}
.drawer-sub { font-size: 11px; color: #8A8A94; margin-bottom: 18px; }

.user-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.user-row {
  display: flex; align-items: center; gap: 9px;
  background: #F9F8F5; border: 1px solid #ECEAE3; border-radius: 8px;
  padding: 9px 11px;
}
.user-row .av {
  width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
  color: #fff; font: 700 11px/28px "Geist",sans-serif; text-align: center;
}
.user-row .info { flex: 1; min-width: 0; }
.user-row .info .name { font-size: 12px; font-weight: 600; color: #16161A; }
.user-row .info .meta { font-size: 10px; color: #8A8A94; margin-top: 1px; }
.user-row .actions { display: flex; gap: 4px; }
.icon-btn {
  width: 26px; height: 26px; border-radius: 6px; border: 1px solid #ECEAE3;
  background: #fff; cursor: pointer; font-size: 12px;
  display: flex; align-items: center; justify-content: center; color: #8A8A94;
}
.icon-btn:hover { background: #F4F2EC; }
.icon-btn.del { color: #D7263D; border-color: #f2d4d4; }

.add-btn {
  width: 100%; padding: 9px; border: 1.5px dashed #24479E50; border-radius: 8px;
  background: #24479E06; color: #24479E; font: 600 12px "Geist",sans-serif;
  cursor: pointer; text-align: center; margin-bottom: 16px;
}

.divider-line { height: 1px; background: #ECEAE3; margin: 14px 0; }

.add-form { display: flex; flex-direction: column; gap: 8px; }
.add-form .field-label { font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: #8A8A94; margin-bottom: 3px; }
.add-form input {
  width: 100%; padding: 8px 11px; border: 1.5px solid #DFDCD3; border-radius: 7px;
  font: 13px "Geist",sans-serif; color: #16161A; background: #fff; outline: none;
}
.add-form input:focus { border-color: #24479E; box-shadow: 0 0 0 2px rgba(36,71,158,.10); }
.toggle-row {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 12px; color: #2E2E36; font-weight: 500;
  background: #F9F8F5; border: 1px solid #ECEAE3; border-radius: 7px; padding: 8px 11px;
}
.toggle {
  width: 32px; height: 18px; border-radius: 9px; background: #24479E;
  position: relative; cursor: pointer; flex-shrink: 0;
}
.toggle::after {
  content: ''; position: absolute; right: 2px; top: 2px;
  width: 14px; height: 14px; border-radius: 50%; background: #fff;
}
.save-btn {
  width: 100%; padding: 10px; border: 0; border-radius: 7px;
  background: #C24A2C; color: #fff; font: 600 13px "Geist",sans-serif; cursor: pointer;
}
</style>
</head>
