<!-- Loading screen hide — plain script, polls until React has mounted (#root has children) -->
<script>
(function hideBnsLoader() {
  var maxWait = 20000; // 20s max
  var start = Date.now();
  function check() {
    var loader = document.getElementById('bns-loading');
    if (!loader) return;
    var root = document.getElementById('root');
    var hasContent = root && root.children.length > 0;
    var timedOut = Date.now() - start > maxWait;
    if (hasContent || timedOut) {
      loader.style.transition = 'opacity 0.3s';
      loader.style.opacity = '0';
      setTimeout(function() { if (loader.parentNode) loader.parentNode.removeChild(loader); }, 350);
    } else {
      setTimeout(check, 100);
    }
  }
  setTimeout(check, 300);
})();
</script>
