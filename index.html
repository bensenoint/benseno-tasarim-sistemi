## 📖 Kullanım Kılavuzu

### Brief Açma

* **Workflow ile (önerilen):** Marka kanalında bookmark \`📋 Yeni Brief Aç\` butonuna bas. Form'da: İş özeti, Süre (datetime picker · TR saat), Atananlar (multi-select), İş tipi, Akış (Paralel/Sıralı), Ref URL, Not. Form gönderilince brief otomatik Canvas'a yazılır.
* **Manuel brief:** Marka kanalına \`📋 İş özeti\` ile başlayan mesaj yaz (eski format · workflow yoksa fallback).
* **Departman:** 📋 Tasarım · ✍️ Editör · 🤖 AI — ilk satırda emoji kullan, yoksa atananlardan otomatik tespit edilir.
* **Atananlar:** Slack user mention ile (\`@Pelin Özdemir\`). Paralel akış için virgül (\`,\`), Sıralı akış için \`>\` ile ayır (\`@Aykut > @Eda T\`).
* **Süre:** UTC verirsen TR'ye (+3) çevrilir. Saatsiz verirsen (sadece tarih) "tüm gün" varsayılır → 23:59 TR.
* **Öncelik:** Otomatik hesaplanır (deadline'dan). Manuel set için yönetici reaction (🔴/🟠/🟡/🟢).

### Reaction & Komut

* **Reaction PARENT mesaja (thread'e değil):**
    * 🎨/✍️/🤖 → İş kabul edildi (Durum: 🎨 Yapılıyor)
    * 👀 → Revize için editöre gönderildi
    * ✅ → İş tamamlandı (Tamamlanan İşler'e taşınır)
    * 🔴/🟠/🟡/🟢 (yönetici tarafından) → Manuel öncelik override
    * ⛔ → Brief iptal (force close)
* **Komutlar (brief thread'inde):**
    * \`✅ ok\` veya \`teyit\` → Geçmiş tarih teyidi
    * \`dispatch @KullanıcıAdı\` → Yöneticinin başka tasarımcıya iletmesi
    * \`revize ✓\` → Revize tamamlandı, atanana geri

### Sınırlar

* Max 6 aktif · Max 2 acil/kişi · 3+ fark uyarısı
* **STALE eşiği:** 🔴=1g · 🟠=3g · 🟡=7g · 🟢=14g
