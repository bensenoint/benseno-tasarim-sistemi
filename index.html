  html, body { background: var(--paper); }
  body { margin: 0; min-width: 360px; }

  /* Tabular figures inside every dashboard table */
  table { font-variant-numeric: tabular-nums; }

  /* ─── Responsive breakpoints ──────────────────────────────────────── */

  /* Tablet (≤ 1024px) */
  @media (max-width: 1024px) {
    .bn-kpi-grid {
      grid-template-columns: repeat(4, 1fr) !important;
    }
    .bn-grid-2 {
      grid-template-columns: 1fr !important;
    }
    .bn-grid-3 {
      grid-template-columns: 1fr 1fr !important;
    }
    main { padding: 8px 16px 64px !important; }
  }

  /* Phone (≤ 720px) — only Overview/Jobs/Profile are designed for this */
  @media (max-width: 720px) {
    main { padding: 8px 12px 80px !important; }
    .bn-kpi-grid {
      grid-template-columns: repeat(2, 1fr) !important;
    }
    .bn-grid-3 {
      grid-template-columns: 1fr !important;
    }
    /* Soft graceful degradation for non-mobile-optimized tabs */
    [data-screen-label="team"] table,
    [data-screen-label="gantt"] table,
    [data-screen-label="brand"] table,
    [data-screen-label="completed"] table,
    [data-screen-label="multi"] table,
    [data-screen-label="dept-comp"] {
      font-size: 12px;
    }
    /* Header trims on phone */
    header [data-mobile-hide], nav [data-mobile-hide] { display: none !important; }
  }

  /* Hide search/view-mode/sync indicator on very small screens */
  @media (max-width: 820px) {
    header > button[style*="min-width: 280px"] { display: none !important; }
  }
  @media (max-width: 640px) {
    /* Header right cluster trims */
    header > div:last-child > span,
    header > div:last-child > div[style*="background:var(--paper-2)"] {
      display: none !important;
    }
  }

  /* Print: pages keep their identity */
  @media print {
    .twk-panel, .__noprint { display: none !important; }
    body { background: #fff; }
  }
</style>

<div id="root"></div>

<script>
  // Suppress benign ResizeObserver loop warning + actually break the loop by
  // deferring all ResizeObserver callbacks to the next animation frame.
  (function () {
    const RX = /ResizeObserver loop/;
    // Capture-phase listener (preferred)
    window.addEventListener("error", (e) => {
      if (e.message && RX.test(e.message)) {
        e.stopImmediatePropagation();
        e.preventDefault();
        return false;
      }
    }, true);
    // window.onerror (legacy)
    const prevOnError = window.onerror;
    window.onerror = function (msg, ...rest) {
      if (typeof msg === "string" && RX.test(msg)) return true;
      return prevOnError ? prevOnError.call(this, msg, ...rest) : false;
    };
    const origError = console.error;
    console.error = function (...args) {
      if (args.length && typeof args[0] === "string" && RX.test(args[0])) return;
      return origError.apply(this, args);
    };
    const origWarn = console.warn;
    console.warn = function (...args) {
      if (args.length && typeof args[0] === "string" && RX.test(args[0])) return;
      return origWarn.apply(this, args);
    };
    // Replace ResizeObserver with a no-op stub. The page does not depend on
    // any ResizeObserver behavior — the tweaks panel uses a window.resize
    // fallback instead. Stubbing prevents the benign "loop completed" warning
    // that fires when browser-internal observation queues can't deliver.
    if (typeof ResizeObserver !== "undefined") {
      window.ResizeObserver = class {
        constructor() {}
        observe() {}
        unobserve() {}
        disconnect() {}
      };
    }
  })();
</script>
