<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panom · Benseno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:7px;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important;} }
  ::selection{background:rgba(217,84,43,.18);}
  .pscroll::-webkit-scrollbar{width:7px;height:7px;}
  .pscroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;}
  .pscroll::-webkit-scrollbar-track{background:transparent;}
  @keyframes odyBob{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-5px) rotate(2deg);}}
  @keyframes blobBreathe{0%,100%{transform:scale(1);}50%{transform:scale(1.09);}}
  @keyframes popIn{0%{transform:scale(.8);opacity:0;}100%{transform:scale(1);opacity:1;}}
  @keyframes panelIn{0%{transform:translateY(12px) scale(.98);opacity:0;}100%{transform:translateY(0) scale(1);opacity:1;}}
  @keyframes blink{0%,90%,100%{transform:scaleY(1);}95%{transform:scaleY(.1);}}
  @keyframes odyPop{0%{transform:scale(.78);}60%{transform:scale(1.12);}100%{transform:scale(1);}}
  @keyframes odyBounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
  @keyframes odyShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-1.5px);}75%{transform:translateX(1.5px);}}
  @keyframes shimmer{0%{background-position:100% 0;}100%{background-position:0 0;}}
  .shim{background:linear-gradient(90deg,var(--skel1) 25%,var(--skel2) 37%,var(--skel1) 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; will-change:background-position;}
  /* desktop collapsed rail that expands as an overlay flyout */
  .sbpanel{position:absolute; top:0; left:0; bottom:0; width:78px; background:var(--sidebar); border-right:1px solid var(--line); display:flex; flex-direction:column; overflow:hidden; transition:width .26s cubic-bezier(.2,.8,.2,1), box-shadow .26s ease; z-index:1;}
  .sbrail:hover .sbpanel{width:282px; box-shadow:22px 0 64px -30px rgba(40,30,15,.5);}
  .sbpanel .sb-text{opacity:0; transition:opacity .14s ease; pointer-events:none;}
  .sbrail:hover .sbpanel .sb-text{opacity:1; pointer-events:auto;}
  .sbpanel .sb-grp{opacity:0; height:0; margin:0; overflow:hidden; transition:opacity .14s ease, height .2s ease, margin .2s ease;}
  .sbrail:hover .sbpanel .sb-grp{opacity:1; height:auto; margin:9px 0 3px;}
  .sbpanel .sb-mark{display:flex;}
  .sbrail:hover .sbpanel .sb-mark{display:none;}
  .sbpanel .sb-full{display:none;}
  .sbrail:hover .sbpanel .sb-full{display:block;}
  .sbpanel .sblogo{padding-left:0; padding-right:0; justify-content:center;}
  .sbrail:hover .sbpanel .sblogo{padding-left:22px; padding-right:22px; justify-content:space-between;}
  .sbnav{scrollbar-width:none;}
  .sbnav::-webkit-scrollbar{display:none;}
  .sb-mark{display:none;}
  .sb-full{display:block;}
</style>
</head>
<body>
<div id="root"></div>
<script src="../app/calc.js?v=1781389309"></script>
<script src="../app/data.js?v=1781389309"></script>
<script src="app/bundle.js?v=1781389309"></script>
<script>
  (function () {
    if (!localStorage.getItem("bns_token")) { location.href = "../dashboard/"; return; }
    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(window.PanomApp));
  })();
</script>
</body>
</html>
