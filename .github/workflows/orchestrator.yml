name: Benseno Orchestrator

on:
  schedule:
    - cron: '15,45 5,6,7,8,9,10,11,12,13 * * 1-5'
  workflow_dispatch:

jobs:
  orchestrator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g @anthropic-ai/claude-code
      - name: Orchestrator calistir
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_APP_TOKEN: ${{ secrets.SLACK_APP_TOKEN }}
          SLACK_USER_TOKEN: ${{ secrets.SLACK_USER_TOKEN }}
          SLACK_TEAM_ID: ${{ secrets.SLACK_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.BENSENO_GITHUB_PAT }}
        run: claude -p "Skill: benseno-orchestrator — run" --dangerously-skip-permissions --print
